<!DOCTYPE html>
<html>
<head>
  <title>World Map Explorer</title>
</head>
<body>

  <h1>World Map Explorer</h1>
  <p>Click on a country to open its Wikipedia page.</p>

  <img src="world.png" width="900" height="450" usemap="#worldmap" alt="World Map">

  <map name="worldmap">

  
    <area shape="rect" coords="138,102,282,162" href="https://en.wikipedia.org/wiki/United_States" target="_blank" alt="United States">
    <area shape="rect" coords="512,146,538,170" href="https://en.wikipedia.org/wiki/Egypt" target="_blank" alt="Egypt">


    <area shape="circle" coords="785,288,45" href="https://en.wikipedia.org/wiki/Australia" target="_blank" alt="Australia">
    <area shape="circle" coords="795,132,15" href="https://en.wikipedia.org/wiki/Japan" target="_blank" alt="Japan">


    <area shape="poly" coords="300,212,325,225,362,240,355,262,330,290,312,300,305,275,275,250,268,238" href="https://en.wikipedia.org/wiki/Brazil" target="_blank" alt="Brazil">
    <area shape="poly" coords="620,165,638,140,650,150,670,158,680,162,670,170,650,190,642,205,632,182" href="https://en.wikipedia.org/wiki/India" target="_blank" alt="India">


    <area shape="default" href="https://en.wikipedia.org/wiki/World_map" target="_blank" alt="World Map">

  </map>

</body>
</html>
